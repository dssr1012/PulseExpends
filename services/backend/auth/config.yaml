# configuration del servidor de authentication PulseExpends

server:
  port: 8082
  host: "0.0.0.0"
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database:
  host: "localhost"
  port: 5432
  user: "pulseexpends"
  password: "pulseexpends_password"
  name: "pulseexpends"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

auth:
  jwt_secret: "your-jwt-secret-key-change-in-production"
  jwt_expiry: "168h" # 7 días
  google_client_id: "your-google-client-id.apps.googleusercontent.com"
  google_client_secret: "your-google-client-secret"
  google_redirect_url: "http://localhost:8082/api/auth/google/callback"
  cookie_secret: "your-cookie-secret-key-change-in-production"
  cookie_name: "pulseexpends_session"
  cookie_max_age: 604800 # 7 días en segundos
  cookie_secure: false # Cambiar a true en producción con HTTPS
  cookie_http_only: true
  cookie_same_site: "lax"

security:
  bcrypt_cost: 12
  rate_limit_requests: 100
  rate_limit_window: "1m"
  cors_allowed_origins:
    - "http://localhost:3000"
    - "http://pulseexpends.duckdns.org"
    - "https://pulseexpends.duckdns.org"
  cors_allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  cors_allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"

logging:
  level: "info"
  format: "json"
  output: "stdout"

monitoring:
  enable_metrics: true
  metrics_port: 9091
  health_check_path: "/health"
  prometheus_path: "/metrics"

email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: "your-email@gmail.com"
  smtp_password: "your-app-password"
  from_address: "noreply@pulseexpends.duckdns.org"

features:
  enable_registration: true
  enable_google_oauth: true
  enable_email_verification: false
  enable_password_reset: true
  enable_circle_invites: true
  enable_transaction_splitting: true
  enable_recurring_transactions: true

limits:
  max_file_size_mb: 10
  max_transactions_per_user: 10000
  max_circles_per_user: 50
  max_members_per_circle: 100
  max_attachments_per_transaction: 5

defaults:
  currency: "USD"
  language: "es"
  timezone: "UTC"
  date_format: "YYYY-MM-DD"
  currency_format: "$0,0.00"
  theme: "light"