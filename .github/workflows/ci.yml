name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, ai-engine, shared]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ${{ matrix.service }}/package-lock.json
    
    - name: Install dependencies
      run: |
        cd ${{ matrix.service }}
        npm ci
    
    - name: Run linting
      run: |
        cd ${{ matrix.service }}
        npm run lint
    
    - name: Run tests
      run: |
        cd ${{ matrix.service }}
        npm test
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        directory: ${{ matrix.service }}/coverage
        flags: ${{ matrix.service }}
        name: ${{ matrix.service }}-coverage

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [backend, frontend, ai-engine, shared]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ${{ matrix.service }}/package-lock.json
    
    - name: Install dependencies
      run: |
        cd ${{ matrix.service }}
        npm ci
    
    - name: Build
      run: |
        cd ${{ matrix.service }}
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-build
        path: ${{ matrix.service }}/dist

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pulse-expends-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/pulse-expends-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pulse-expends-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/pulse-expends-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push ai-engine
      uses: docker/build-push-action@v5
      with:
        context: ./ai-engine
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pulse-expends-ai:latest
          ${{ secrets.DOCKER_USERNAME }}/pulse-expends-ai:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Add your deployment commands here
        # For example:
        # - kubectl apply -f k8s/
        # - ssh user@server "cd /app && docker-compose pull && docker-compose up -d"
        
        # This is a placeholder - replace with your actual deployment commands
        echo "Deployment would happen here"
    
    - name: Notify deployment
      run: |
        echo "Deployment completed successfully!"
        # Add notification commands here (Slack, Discord, etc.)

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Run security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects
    
    - name: Run dependency audit
      run: |
        npm audit --audit-level=high
        cd backend && npm audit --audit-level=high
        cd ../frontend && npm audit --audit-level=high
        cd ../ai-engine && npm audit --audit-level=high
        cd ../shared && npm audit --audit-level=high

  quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
    
    - name: Check for secrets
      uses: gitleaks/gitleaks-action@v2
      with:
        config-path: .gitleaks.toml
    
    - name: Check commit messages
      uses: wagoid/commitlint-github-action@v5