# Configuración CORRECTA de nginx para PulseExpends
# Esta configuración soluciona el problema de routing y sirve como referencia

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/pulseexpends-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # MCP Server API - Rutas compatibles
    location /mcp/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Connection '';
    }
    
    # Compatibilidad con rutas antiguas
    location /api/mcp/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Connection '';
    }

    # PDF Parser API - Rutas compatibles
    location /pdf/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Connection '';
    }
    
    # Compatibilidad con rutas antiguas
    location /api/pdf/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Connection '';
    }

    # Status Dashboard
    location /status/ {
        proxy_pass http://localhost:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Connection '';
    }
    
    location /api/status/ {
        proxy_pass http://localhost:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Connection '';
    }

    # Health checks
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    location /mcp/health {
        proxy_pass http://localhost:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    location /pdf/health {
        proxy_pass http://localhost:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    location /status/health {
        proxy_pass http://localhost:8081/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# NOTAS IMPORTANTES:
# 1. Asegúrate de que este archivo sea el único en /etc/nginx/sites-enabled/
# 2. Elimina o deshabilita el archivo 'default' en sites-enabled
# 3. Verifica la sintaxis con: sudo nginx -t
# 4. Recarga nginx con: sudo systemctl reload nginx
# 5. El frontend debe estar en /var/www/pulseexpends-frontend/ o ajusta la ruta 'root'